

services:
  postgres:
    image: postgres:15-alpine
    container_name: projeto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: projeto_db
      POSTGRES_USER: projeto_user
      POSTGRES_PASSWORD: projeto_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: